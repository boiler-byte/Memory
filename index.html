}
@font-face {
  font-family: 'Valeska';
  font-style: normal;
  font-weight: 400;

  src: url(fonts/Valeska-V44Pl.otf) format('opentype');
}
@font-face {
  font-family: 'Noble';

  font-weight: 400;

  src: url(fonts/NobleElegantRegular-ov6vo.ttf) format('opentype');
}


/* ---------- DUNKLES DESIGN ---------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
}
body {
  background: #0b0e14;
  color: #eef2f5;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  padding: 1.5rem;
}
.app {
  max-width: 1200px;
  width: 100%;
}

/* Kopfzeile / Metriken */
.stats-bar {
  display: flex;
  gap: 2rem;
  background: #1a1f2b;
  padding: 0.9rem 1.8rem;
  border-radius: 60px;
  margin-bottom: 1.5rem;
  box-shadow: 0 8px 20px rgba(0,0,0,0.6);
  justify-content: center;
  flex-wrap: wrap;
}
.stat-item {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 1.3rem;
  font-weight: 600;
  color: #cddbe7;
}
.stat-item i {
  font-size: 1.8rem;
  color: #5f9ea0;
}

/* Steuerung / Startansicht */
.setup-panel {
  background: #151b24;
  border-radius: 2rem;
  padding: 2rem 2rem 1.8rem;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
  border: 1px solid #2d3748;
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;
  align-items: flex-end;
}
.field-group {
  flex: 1 1 220px;
  min-width: 180px;
}
.field-group label {
  display: block;
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #9aa8b9;
  margin-bottom: 0.4rem;
}
select, input[type="text"], button {
  background: #1e2632;
  border: 1px solid #334155;
  color: #f0f4fa;
  padding: 0.75rem 1.2rem;
  border-radius: 40px;
  font-size: 1rem;
  width: 100%;
  outline: none;
  transition: 0.2s;
}
select:focus, input:focus {
  border-color: #5f9ea0;
  box-shadow: 0 0 0 3px rgba(95,158,160,0.2);
}
button {
  background: #2e4a5c;
  border: none;
  font-weight: 600;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  width: auto;
  padding: 0.75rem 1.8rem;
  transition: background 0.15s, opacity 0.15s;
}
button:hover:not(:disabled) {
  background: #3f6074;
}
button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.button-row {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
  margin-top: 1rem;
}
.hint-error {
  color: #f87171;
  font-size: 0.85rem;
  margin-top: 0.5rem;
  min-height: 1.3rem;
}

/* Custom-Theme-Liste mit Löschbutton */
.theme-select-wrapper {
  display: flex;
  gap: 0.5rem;
  align-items: center;
}
.theme-select-wrapper select {
  flex: 1;
}
.delete-theme-btn {
  background: #3b2e3a;
  border: 1px solid #6b4a5a;
  color: #e0b7c9;
  padding: 0.7rem 1rem;
  border-radius: 40px;
  font-size: 1.2rem;
  width: auto;
  line-height: 1;
}
.delete-theme-btn:hover {
  background: #553b4b;
  color: #ffc0d0;
}

/* Kartenraster */
.board {
  display: grid;
  gap: 0.9rem;
  margin-top: 2rem;
  justify-content: center;
  margin: 1rem auto;
  perspective: 1200px;
}
.card {
  aspect-ratio: 1 / 1;
  background: #212b36;
  border-radius: 1.2rem;
  box-shadow: 0 6px 0 #0d1219, 0 8px 20px rgba(0,0,0,0.6);
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.3s ease, opacity 0.3s, filter 0.2s;
  position: relative;
  user-select: none;
}
.card.flipped {
  transform: rotateY(180deg);
}
.card.matched {
  pointer-events: none;
  box-shadow: 0 0 0 2px #5f9ea0;
  transition: transform 0.6s ease, opacity 0.6s, filter 0.4s;
}
.card.matched .card-front {
    filter: grayscale(1);
    opacity: 0.5;
}
.card .card-front, .card .card-back {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  border-radius: 1.2rem;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.card .card-back {
  background: #1a212c;
  border: 2px solid #2d3f4e;
  font-size: 2.4rem;
  color: #4e6b7c;
  transform: rotateY(0deg);
}
.card .card-front {
  background: #1e2632;
  transform: rotateY(180deg);
  padding: 0.3rem;
}
.card .card-front img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 1rem;
  display: block;
  transition: all 0.3s;
}

/* ---------- NEU: Deal-Animation ---------- */
.card.dealing {
  opacity: 0;
  transform: translateY(-120px) scale(0.3) rotate(-15deg);
  pointer-events: none;
}
.card.deal-in {
  animation: dealCard 0.45s cubic-bezier(0.22, 1.2, 0.36, 1) forwards;
  pointer-events: none;
}
@keyframes dealCard {
  0% {
    opacity: 0;
    transform: translateY(-120px) scale(0.3) rotate(-15deg);
  }
  60% {
    opacity: 1;
    transform: translateY(8px) scale(1.04) rotate(2deg);
  }
  80% {
    transform: translateY(-3px) scale(0.99) rotate(-0.5deg);
  }
  100% {
    opacity: 1;
    transform: translateY(0) scale(1) rotate(0deg);
  }
}
/* Board während Deal gesperrt */
.board.dealing-active {
  pointer-events: none;
}
.board.dealing-active .card {
  pointer-events: none;
}

/* Ergebnisliste & Modal */
.result-section {
  background: #151b24;
  border-radius: 2rem;
  padding: 1.5rem 2rem;
  margin-top: 2rem;
  border: 1px solid #2d3748;
}
.result-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 1rem;
}
.result-list {
  list-style: none;
  max-height: 280px;
  overflow-y: auto;
  font-size: 0.9rem;
  color: #cbd5e1;
}
.result-list li {
  display: flex;
  justify-content: space-between;
  padding: 0.5rem 0.2rem;
  border-bottom: 1px solid #26303b;
}
.result-list .result-theme,
.result-list .result-time {
  color: var(--ui-muted);
  font-size: 0.85em;
}
.result-list .result-time {
  cursor: help;
  text-decoration: underline dotted;
  text-underline-offset: 2px;
}

.highscore-box {
  background: #1e2a36;
  border-radius: 1rem;
  padding: 0.8rem 1.2rem;
  font-weight: 500;
}
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 1rem;
}
.modal-content {
  background: #151f2b;
  border-radius: 2rem;
  padding: 2rem;
  max-width: 500px;
  width: 100%;
  border: 1px solid #3a4d5e;
  box-shadow: 0 25px 40px black;
  max-height: 92vh;
  overflow-y: auto;
  position: relative;
}
.modal-content h3 {
  margin-bottom: 1rem;
  font-weight: 600;
}
.modal-content .field-group {
  margin-bottom: 1.2rem;
}
.modal-actions {
  display: flex;
  gap: 1rem;
  justify-content: flex-end;
  flex-wrap: wrap;
}
.close-btn {
  background: transparent;
  border: 1px solid #3a4d5e;
}
.upload-errors {
  color: #f87171;
  font-size: 0.8rem;
  margin-top: 0.6rem;
  min-height: 1.1rem;
}
.hidden {
  display: none !important;
}
.end-game-panel {
  text-align: center;
  background: #151f2b;
  border-radius: 2rem;
  padding: 2rem;
  margin-top: 1.5rem;
}
.end-game-panel input {
  max-width: 250px;
  margin: 1rem auto;
}

/* Abbrechen-Button in der Kopfzeile */
.abort-btn {
background: #3b2026;
border: 1px solid #7a3b46;
color: #f6b8c4;
padding: 0.6rem 1.4rem;
border-radius: 40px;
font-size: 1rem;
font-weight: 600;
cursor: pointer;
display: inline-flex;
align-items: center;
gap: 0.5rem;
transition: background 0.15s, color 0.15s;
width: auto;
}
.abort-btn:hover {
background: #5c2f3a;
color: #ffd7e0;
}

/* ---------- NEU: Bildervorschau ---------- */
.theme-preview {
  margin-top: 1.2rem;
  padding: 1rem;
  background: #10151d;
  border: 1px solid #2d3748;
  border-radius: 1.2rem;
}
.theme-preview-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: #9aa8b9;
  margin-bottom: 0.7rem;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.theme-preview-title .preview-count {
  font-size: 0.7rem;
  color: #64748b;
  text-transform: none;
  letter-spacing: 0;
}
.theme-preview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
  gap: 0.5rem;
}
.theme-preview-item {
  aspect-ratio: 1 / 1;
  border-radius: 0.6rem;
  overflow: hidden;
  background: #1e2632;
  border: 1px solid #2d3748;
  position: relative;
}
.theme-preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.theme-preview-more {
  aspect-ratio: 1 / 1;
  border-radius: 0.6rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1e2632;
  border: 1px dashed #3a4d5e;
  color: #9aa8b9;
  font-weight: 600;
  font-size: 0.95rem;
}
.theme-preview-empty {
  color: #64748b;
  font-size: 0.85rem;
  font-style: italic;
  padding: 0.3rem 0;
}

/* ---------- NEU: Erstell-/Bearbeiten-Dialog ---------- */
.theme-editor-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));
  gap: 0.5rem;
  margin-top: 0.6rem;
  max-height: 280px;
  overflow-y: auto;
  padding: 0.3rem;
  background: #10151d;
  border: 1px solid #2d3748;
  border-radius: 1rem;
  min-height: 80px;
}
.theme-editor-item {
  aspect-ratio: 1 / 1;
  border-radius: 0.6rem;
  overflow: hidden;
  background: #1e2632;
  border: 1px solid #2d3748;
  position: relative;
  cursor: pointer;
  transition: transform 0.15s, border-color 0.15s;
}
.theme-editor-item:hover {
  transform: scale(1.05);
  border-color: #f87171;
}
.theme-editor-item:hover::after {
  content: '\F62A'; /* Bootstrap icon: trash */
  font-family: 'bootstrap-icons';
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(120, 20, 30, 0.7);
  color: #fff;
  font-size: 1.4rem;
}
.theme-editor-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.theme-editor-empty {
  grid-column: 1 / -1;
  color: #64748b;
  font-size: 0.85rem;
  font-style: italic;
  padding: 0.6rem;
  text-align: center;
}
.theme-editor-toolbar {
  display: flex;
  gap: 0.6rem;
  flex-wrap: wrap;
  margin-top: 0.6rem;
}
.theme-editor-toolbar button {
  padding: 0.6rem 1.1rem;
  font-size: 0.9rem;
}
.theme-editor-toolbar .paste-btn {
  background: #2e4a5c;
}
.theme-editor-count {
  font-size: 0.8rem;
  color: #9aa8b9;
  margin-top: 0.4rem;
}

/* UI-Designs: unabhängig von den Kartenmotiv-Themen */
:root {
  --ui-bg:#0b0e14; --ui-text:#eef2f5; --ui-panel:#151b24;
  --ui-bar:#1a1f2b; --ui-muted:#9aa8b9; --ui-border:#2d3748;
  --ui-control:#1e2632; --ui-control-border:#334155;
  --ui-accent:#5f9ea0; --ui-button:#2e4a5c; --ui-button-hover:#3f6074;
  --ui-card:#212b36; --ui-card-back:#1a212c; --ui-card-border:#2d3f4e;
  --ui-card-icon:#4e6b7c; --ui-shadow:0 10px 30px rgba(0,0,0,.6);
  --ui-radius:2rem; --ui-card-radius:1.2rem;
}
body[data-ui-theme="neon"] {
  --ui-bg:#08071b; --ui-text:#f5efff; --ui-panel:#17102e;
  --ui-bar:#201039; --ui-muted:#c2a8e5; --ui-border:#7536be;
  --ui-control:#21153f; --ui-control-border:#8b4fcb;
  --ui-accent:#00f5d4; --ui-button:#7125b5; --ui-button-hover:#a136e0;
  --ui-card:#21143f; --ui-card-back:#1c1038; --ui-card-border:#a143ef;
  --ui-card-icon:#00f5d4; --ui-shadow:0 10px 34px rgba(151,46,255,.22);
}
body[data-ui-theme="retro"] {
  --ui-bg:#292319; --ui-text:#fff0c6; --ui-panel:#403323;
  --ui-bar:#55402a; --ui-muted:#e2c58d; --ui-border:#a77b40;
  --ui-control:#493725; --ui-control-border:#b48a4b;
  --ui-accent:#ffbf47; --ui-button:#ad592e; --ui-button-hover:#c7743c;
  --ui-card:#59412a; --ui-card-back:#42301f; --ui-card-border:#e5ad55;
  --ui-card-icon:#ffd16e; --ui-shadow:5px 6px 0 rgba(0,0,0,.35);
  --ui-radius:.45rem; --ui-card-radius:.35rem;
}
body[data-ui-theme="retro"] * { font-family: 'Courier New', monospace; }
body[data-ui-theme="minimal"] {
  --ui-bg:#f6f7f8; --ui-text:#20252b; --ui-panel:#ffffff;
  --ui-bar:#ffffff; --ui-muted:#606c78; --ui-border:#dce1e6;
  --ui-control:#f7f8fa; --ui-control-border:#cdd4dc;
  --ui-accent:#2563eb; --ui-button:#253449; --ui-button-hover:#41556e;
  --ui-card:#e9edf1; --ui-card-back:#e9edf1; --ui-card-border:#c5ced7;
  --ui-card-icon:#64748b; --ui-shadow:0 4px 18px rgba(20,35,50,.07);
  --ui-radius:.8rem; --ui-card-radius:.55rem;
}
body[data-ui-theme="glassmorphism"] {
  --ui-bg:#17283f; --ui-text:#ffffff; --ui-panel:rgba(255,255,255,.12);
  --ui-bar:rgba(255,255,255,.15); --ui-muted:#d5e3f4;
  --ui-border:rgba(255,255,255,.3); --ui-control:rgba(255,255,255,.13);
  --ui-control-border:rgba(255,255,255,.32); --ui-accent:#8ce9ff;
  --ui-button:#396db5; --ui-button-hover:#548bd2;
  --ui-card:rgba(255,255,255,.2); --ui-card-back:rgba(255,255,255,.13);
  --ui-card-border:rgba(255,255,255,.35); --ui-card-icon:#c3f3ff;
  --ui-shadow:0 12px 35px rgba(0,0,0,.18);
}


/* Vorschau an UI-Theme anpassen */
body:not([data-ui-theme="default"]) .theme-preview { background:var(--ui-control); border-color:var(--ui-border); }
body:not([data-ui-theme="default"]) .theme-preview-title { color:var(--ui-muted); }
body:not([data-ui-theme="default"]) .theme-preview-item { background:var(--ui-card-back); border-color:var(--ui-card-border); }
body:not([data-ui-theme="default"]) .theme-preview-more { background:var(--ui-card-back); border-color:var(--ui-card-border); color:var(--ui-muted); }
body:not([data-ui-theme="default"]) .theme-editor-grid { background:var(--ui-control); border-color:var(--ui-border); }
body:not([data-ui-theme="default"]) .theme-editor-item { background:var(--ui-card-back); border-color:var(--ui-card-border); }
body:not([data-ui-theme="default"]) .theme-editor-count { color:var(--ui-muted); }

body:not([data-ui-theme="default"]) { background:var(--ui-bg); color:var(--ui-text); transition:background .25s,color .25s; }
body[data-ui-theme="glassmorphism"] {
  background: radial-gradient(ellipse at 10% 10%,#7661b7 0%,transparent 45%),
              radial-gradient(ellipse at 90% 75%,#147e9e 0%,transparent 48%),#17283f;
  background-attachment:fixed;
}
body:not([data-ui-theme="default"]) .stats-bar { background:var(--ui-bar); box-shadow:var(--ui-shadow); }
body:not([data-ui-theme="default"]) .stat-item { color:var(--ui-text); }
body:not([data-ui-theme="default"]) .stat-item i { color:var(--ui-accent); }
body:not([data-ui-theme="default"]) .setup-panel, body:not([data-ui-theme="default"]) .result-section, body:not([data-ui-theme="default"]) .modal-content, body:not([data-ui-theme="default"]) .end-game-panel {
  background:var(--ui-panel); border:1px solid var(--ui-border);
  border-radius:var(--ui-radius); box-shadow:var(--ui-shadow);
}
body:not([data-ui-theme="default"]) .field-group label { color:var(--ui-muted); }
body:not([data-ui-theme="default"]) select, body:not([data-ui-theme="default"]) input[type="text"], body:not([data-ui-theme="default"]) button {
  background:var(--ui-control); border:1px solid var(--ui-control-border);
  color:var(--ui-text);
}
body:not([data-ui-theme="default"]) select:focus, body:not([data-ui-theme="default"]) input:focus { border-color:var(--ui-accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--ui-accent) 25%,transparent); }
body:not([data-ui-theme="default"]) button:not(.abort-btn):not(.delete-theme-btn):not(.close-btn):not(.peek-btn) { background:var(--ui-button); color:#fff; }
body:not([data-ui-theme="default"]) button:not(.abort-btn):not(.delete-theme-btn):not(.close-btn):not(.peek-btn):hover:not(:disabled) { background:var(--ui-button-hover); }
body:not([data-ui-theme="default"]) .card { background:var(--ui-card); border-radius:var(--ui-card-radius); box-shadow:var(--ui-shadow); }
body:not([data-ui-theme="default"]) .card .card-front, body:not([data-ui-theme="default"]) .card .card-back { border-radius:var(--ui-card-radius); }
body:not([data-ui-theme="default"]) .card .card-back { background:var(--ui-card-back); border-color:var(--ui-card-border); color:var(--ui-card-icon); }
body:not([data-ui-theme="default"]) .card .card-front { background:var(--ui-control); }
body:not([data-ui-theme="default"]) .card.matched { box-shadow:0 0 0 2px var(--ui-accent); }
body:not([data-ui-theme="default"]) .result-list { color:var(--ui-text); }
body:not([data-ui-theme="default"]) .result-list li { border-bottom-color:var(--ui-border); }
body:not([data-ui-theme="default"]) .highscore-box { background:var(--ui-control); }
body:not([data-ui-theme="default"]) .modal-content, body:not([data-ui-theme="default"]) .close-btn { border-color:var(--ui-border); }
body[data-ui-theme="glassmorphism"] .stats-bar,
body[data-ui-theme="glassmorphism"] .setup-panel,
body[data-ui-theme="glassmorphism"] .result-section,
body[data-ui-theme="glassmorphism"] .modal-content,
body[data-ui-theme="glassmorphism"] .end-game-panel,
body[data-ui-theme="glassmorphism"] .card .card-back { backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
body[data-ui-theme="neon"] .card:not(.matched) { box-shadow:0 0 14px rgba(161,67,239,.3); }
body[data-ui-theme="glassmorphism"] select option { background: #334256 !important; }

.ui-theme-control select { width:auto; max-width:43px; padding:.55rem .9rem; font-size:.9rem; }
select { -webkit-appearance: none;-moz-appearance: none;appearance: none; }

.stats-bar, .board, .setup-panel, .result-section, h1, h3 { transition: all 0.8s; }

h1 { width:100%; padding-bottom: 1.5rem; color: var(--ui-muted); text-align: center; letter-spacing: 0.3rem; font-size: 4rem; }


body[data-ui-theme="neon"] {
  h1 {
    font-family: 'NeonLight';
    font-weight: normal;
    font-size: 6rem;
    padding-bottom: 0;

<script>
// Designwechsel: unabhängig von den Bildthemen und auch während des Spiels.
const UI_THEME_STORAGE_KEY = 'memory_ui_theme';
const uiThemeSelect = document.getElementById('uiThemeSelect');
const availableUiThemes = ['default','neon','retro','minimal','glassmorphism'];




function applyUiTheme(value) {
  const theme = availableUiThemes.includes(value) ? value : 'default';
  document.body.dataset.uiTheme = theme;
  uiThemeSelect.value = theme;
  try { localStorage.setItem(UI_THEME_STORAGE_KEY, theme); } catch (_) {}
}
uiThemeSelect.addEventListener('change', () => applyUiTheme(uiThemeSelect.value));
let savedUiTheme = 'default';
try { savedUiTheme = localStorage.getItem(UI_THEME_STORAGE_KEY) || 'default'; } catch (_) {}
applyUiTheme(savedUiTheme);

// ==================== KONFIGURATION ====================
// grid: [cols, rows] – erst Spalten, dann Zeilen
// sm = Smartphone/Hochkant (schmale Breite, <= 600px)
// lg = Desktop/breit (> 600px)
// Maximal 8 Spalten und 8 Zeilen erlaubt.
// Wichtig: cols*rows muss in sm und lg identisch sein, sonst passt die Set-Anzahl nicht.
// @todo peeks = wie oft kann die Peek-Taste verwendet werden, um die restlichen Karten für eine Sekunde aufzudecken
const GAMES = {
  easy:      { label: "6 Paare",     selection: 2, cards: 12, grid: { sm: [3, 4], lg: [4, 3] }, maxWidth: "800px", peeks: 1 },
  medium:    { label: "10 Paare",    selection: 2, cards: 20, grid: { sm: [4, 5], lg: [5, 4] }, peeks: 2 },
  hard:    { label: "15 Paare",    selection: 2, cards: 30, grid: { sm: [5, 6], lg: [6, 5] }, peeks: 3 },
  harder:    { label: "20 Paare",    selection: 2, cards: 40, grid: { sm: [5, 8], lg: [6, 7] }, maxWidth: "900px", peeks: 3 },
  triplets4: { label: "4 Triplets",  selection: 3, cards: 12, grid: { sm: [3, 4], lg: [4, 3] }, maxWidth: "800px", peeks: 1 },
  triplet6:  { label: "6 Triplets",  selection: 3, cards: 18, grid: { sm: [3, 6], lg: [6, 3] }, peeks: 2 },
  triplet8:  { label: "8 Triplets",  selection: 3, cards: 24, grid: { sm: [4, 6], lg: [6, 4] }, peeks: 3 },
  triplet10:  { label: "10 Triplets",  selection: 3, cards: 30, grid: { sm: [5, 6], lg: [6, 5] }, peeks: 3 },
  triplet14:  { label: "14 Triplets",  selection: 3, cards: 42, grid: { sm: [6, 7], lg: [7, 6] }, peeks: 3 },
  quads4:    { label: "4 Quads",     selection: 4, cards: 16, grid: { sm: [4, 4], lg: [4, 4] }, peeks: 2 },
  quads5:     { label: "5 Quads",     selection: 4, cards: 20, grid: { sm: [4, 5], lg: [5, 4] }, peeks: 3 },
  quads6:     { label: "6 Quads",     selection: 4, cards: 24, grid: { sm: [4, 6], lg: [6, 4] }, peeks: 3 },
  quads9:     { label: "9 Quads",     selection: 4, cards: 36, grid: { sm: [6, 6], lg: [6, 6] }, peeks: 5 },
};

const THEMES = {
  hannabarbera: { label: "Hanna Barbera", custom: false, images: 39, format: 'jpg' },
  looneytunes: { label: "Looney Tunes", custom: false, images: 29, format: 'jpg' },
  marvelheroes: { label: "Marvel Heroes", custom: false, images: 15, format: 'webp' },
  simpsons: { label: "Simpsons", custom: false, images: 29, format: 'webp' },
  tokioparkplatz: { label: "Tokio Parkplatz", custom: false, images: 60, format: 'webp' },
};

// Custom-Themes werden aus LocalStorage geladen (Key: themeKey)
const STORAGE_KEY_THEMES = 'memory_custom_themes';
const STORAGE_KEY_RESULTS = 'memory_results';
const STORAGE_KEY_HIGHSCORES = 'memory_highscores';
const DB_NAME = 'MemoryThemeDB';
const DB_STORE = 'themeImages';

// ==================== STATE ====================
let state = {
  gameKey: 'easy',
  themeKey: 'hannabarbera',
  // Spielfeld
  cards: [],           // { id, setIndex, imageKey, matched }
  firstSelection: [],  // aufgedeckte Karten (max selection)
  matchedSets: 0,
  totalSets: 0,
  moves: 0,
  gameActive: false,
  startTime: null,
  timerInterval: null,
  elapsed: 0,
  inputLocked: false,
  selectionSize: 2,
  // Merkphase
  merkphase: false,
  memorizeTimer: null,
  memorizeInterval: null,
  // NEU: Deal-Animation
  dealTimer: null,
  dealing: false,
  // NEU: Peek
  peeksLeft: 0,
  peekActive: false,
  peekTimer: null,
};

// IndexedDB-Verbindung
let db = null;

const abortGameBtn = document.getElementById('abortGameBtn');

// ==================== STORAGE-SCHICHT ====================
async function initDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(DB_STORE)) {
        db.createObjectStore(DB_STORE);
      }
    };
  });
}

// Custom-Themes aus LocalStorage holen
function getCustomThemes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY_THEMES);
    return raw ? JSON.parse(raw) : {};
  } catch { return {}; }
}

function saveCustomThemes(themes) {
  localStorage.setItem(STORAGE_KEY_THEMES, JSON.stringify(themes));
}

// Bilder für ein Custom-Theme in IndexedDB speichern (Array von dataURLs)
async function storeThemeImages(themeKey, imageDataArray) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const store = tx.objectStore(DB_STORE);
    // imageDataArray = [{ name: "1", data: dataURL }, ...]
    store.put(imageDataArray, themeKey);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// Bilder für ein Theme aus IndexedDB holen
async function getThemeImages(themeKey) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const store = tx.objectStore(DB_STORE);
    const req = store.get(themeKey);
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

// Theme aus IndexedDB löschen
async function deleteThemeImages(themeKey) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const store = tx.objectStore(DB_STORE);
    store.delete(themeKey);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// Ergebnisse (letzte 20)
function getResults() {
  try {

// Spielauswahl befüllen
function populateGameSelect() {
  gameSelect.innerHTML = '';
  for (const [key, game] of Object.entries(GAMES)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = game.label;
    gameSelect.appendChild(opt);
  }
  gameSelect.value = state.gameKey;
}

// Themenauswahl befüllen (inkl. Custom)
function populateThemeSelect() {
  const custom = getCustomThemes();
  themeSelect.innerHTML = '';
  // Standard-Themes
  for (const [key, theme] of Object.entries(THEMES)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = theme.label;
    themeSelect.appendChild(opt);
  }
  // Custom-Themes
  for (const [key, theme] of Object.entries(custom)) {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = `${theme.label} (custom)`;
    themeSelect.appendChild(opt);
  }
  if (themeSelect.options.length > 0) {
    if (!themeSelect.querySelector(`option[value="${state.themeKey}"]`)) {
      state.themeKey = themeSelect.options[0].value;
    }
    themeSelect.value = state.themeKey;
  }
  validateThemeAndGame();
}

// ==================== RESPONSIVE GRID ====================
const SM_BREAKPOINT = 800; // px – entspricht der Media-Query

function isSmallScreen() {
  return window.innerWidth <= SM_BREAKPOINT;
}

// Liefert das aktive Grid als [cols, rows]
// Sicherheitscheck: maximal 8x8
function getActiveGrid(game) {
  const g = isSmallScreen() ? game.grid.sm : game.grid.lg;
  const cols = Math.min(g[0], 8);
  const rows = Math.min(g[1], 8);
  return [cols, rows];
}

// Anzahl Sets (Paare/Triplets/Quads) aus aktivem Grid berechnen
function getActiveSetCount(game) {
  const [cols, rows] = getActiveGrid(game);
  return ( game.cards ?? (cols * rows) ) / game.selection;
}

// Prüfen, ob Thema genügend Bilder für das Spiel hat
function validateThemeAndGame() {
  const game = GAMES[gameSelect.value];
  const themeKey = themeSelect.value;
  const custom = getCustomThemes();
  let themeImages = 0;
  if (THEMES[themeKey]) {
    themeImages = THEMES[themeKey].images;
  } else if (custom[themeKey]) {
    themeImages = custom[themeKey].images;
  }
  const neededSets = getActiveSetCount(game); // responsive
  if (themeImages < neededSets) {
    startBtn.disabled = true;
    themeWarning.textContent = 'Thema hat zu wenig Bilder für das Spiel';
    return false;
  } else {
    startBtn.disabled = false;
    themeWarning.textContent = '';
    return true;
  }
}

// Vorschau rendern
async function renderThemePreview() {
  const themeKey = themeSelect.value;
  const custom = getCustomThemes();
  themePreviewGrid.innerHTML = '';
  themePreviewCount.textContent = '';

  // Info sammeln
  let totalImages = 0;
  let smallImages = 0;
  let getImageSrc;

  if (THEMES[themeKey]) {
    const t = THEMES[themeKey];
    totalImages = t.images;
    getImageSrc = (idx) => `./img/${themeKey}/${idx + 1}.${t.format}`;
  } else if (custom[themeKey]) {
    const t = custom[themeKey];
    totalImages = t.images;
    let stored = [];
    try { stored = await getThemeImages(themeKey); } catch (_) {}
    getImageSrc = (idx) => {
      const item = stored[idx];
      return item ? item.data : null;
    };
  } else {
    themePreviewGrid.innerHTML = '<div class="theme-preview-empty">Kein Thema ausgewählt.</div>';
    return;
  }

  const MAX_THUMBS = 12;
  const shown = Math.min(totalImages, MAX_THUMBS);

  for (let i = 0; i < shown; i++) {
    const src = getImageSrc(i);
    if (!src) continue;
    const item = document.createElement('div');
    item.className = 'theme-preview-item';
    const img = document.createElement('img');
    img.src = src;
    img.alt = `Vorschau ${i + 1}`;
    img.loading = 'lazy';
    item.appendChild(img);
    if( i > 6 ) item.classList.add('small-hidden');
    else smallImages++;
    themePreviewGrid.appendChild(item);
  }

  if (totalImages > MAX_THUMBS) {
    const more = document.createElement('div');
    more.className = 'theme-preview-more';
    more.textContent = `+${totalImages - MAX_THUMBS}`;
    more.classList.add('small-hidden');
    themePreviewGrid.appendChild(more);
  }
  if (totalImages > smallImages ) {
    const more = document.createElement('div');
    more.className = 'theme-preview-more';
    more.textContent = `+${totalImages - smallImages}`;
    more.classList.add('small-show');
    themePreviewGrid.appendChild(more);
  }

  themePreviewCount.textContent = `${totalImages} Bilder`;
}

// Ergebnisliste rendern
  function renderResults() {
    const results = getResults();
    resultList.innerHTML = '';
    if (results.length === 0) {
      resultList.innerHTML = '<li>Noch keine Ergebnisse</li>';
      return;
    }
    results.forEach(r => {
      const li = document.createElement('li');

      // Thema ermitteln (Standard- oder Custom-Theme)
      const themeKey = r.theme || '';
      const themeLabel = getThemeLabel(themeKey);
      const themeText = themeLabel
        ? ` · <span class="result-theme"><i class="bi bi-images"></i> ${escapeHtml(themeLabel)}</span>`
        : '';

      const merk = r.merkphase ? ' · <i class="bi bi-eye"></i> Merkphase' : '';
      const relTime = r.timestamp ? ` · <span class="result-time" title="${escapeHtml(new Date(r.timestamp).toLocaleString('de-DE'))}">${formatRelativeTime(r.timestamp)}</span>` : '';

      li.innerHTML = `<span>${escapeHtml(r.name)} · ${GAMES[r.game]?.label || r.game}${themeText} · ${formatTime(r.elapsed)} · ${r.moves} Züge${merk}${relTime}</span>`;
      resultList.appendChild(li);
    });
  }

  // Liefert den Anzeigenamen eines Themes (Standard oder Custom)
  function getThemeLabel(themeKey) {
    if (!themeKey) return '';
    if (THEMES[themeKey]) return THEMES[themeKey].label;
    const custom = getCustomThemes();
    if (custom[themeKey]) return custom[themeKey].label;
    return themeKey;
  }

  // Ungefähre relative Zeitangabe
  function formatRelativeTime(timestamp) {
    const now = Date.now();
    const diffMs = Math.max(0, now - timestamp);
    const diffMin = diffMs / 60000;
    const diffHr = diffMin / 60;
    const diffDay = diffHr / 24;
    const diffWeek = diffDay / 7;

    if (diffMin < 1) return 'gerade eben';
    if (diffMin < 60) return `vor ${Math.floor(diffMin)} Min.`;
    if (diffHr < 24) return `vor ${Math.floor(diffHr)} Std.`;
    if (diffDay < 30) return `vor ${Math.floor(diffDay)} ${diffDay < 2 ? 'Tag' : 'Tagen'}`;
    if (diffDay < 90) return `vor ${Math.floor(diffWeek)} ${diffWeek < 2 ? 'Woche' : 'Wochen'}`;
    return String(new Date(timestamp).getFullYear());
  }

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// Timer
function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.startTime = Date.now() - (state.elapsed * 1000);
  state.timerInterval = setInterval(() => {
    state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
    timerDisplay.textContent = formatTime(state.elapsed);
  }, 200);
}

function stopTimer() {
  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
  state.elapsed = Math.floor((Date.now() - state.startTime) / 1000);
  timerDisplay.textContent = formatTime(state.elapsed);
}

// ==================== SPIELLOGIK ====================
async function startGame() {
  // Validierung
  if (!validateThemeAndGame()) return;

  const gameKey = gameSelect.value;
  const themeKey = themeSelect.value;
  const game = GAMES[gameKey];
  const [cols, rows] = getActiveGrid(game);   // [cols, rows]
  const selection = game.selection;

  // Theme-Info besorgen
  let themeInfo = null;
  let imageDataArray = []; // Array von dataURLs (bei custom) oder URLs
  const numSets = ( game.cards ?? (cols * rows) ) / selection;

  if (THEMES[themeKey]) {
    themeInfo = THEMES[themeKey];
    const format = themeInfo.format;
    // Alle verfügbaren Bildpfade aufbauen: ./img/{themeKey}/1.{format} ... N.{format}
    const allImages = [];
    for (let i = 1; i <= themeInfo.images; i++) {
      allImages.push(`./img/${themeKey}/${i}.${format}`);
    }
    // Zufällig genau numSets Bilder auswählen
    imageDataArray = pickRandom(allImages, numSets);
  } else {
    const custom = getCustomThemes();
    themeInfo = custom[themeKey];
    if (!themeInfo) {
      alert('Thema nicht gefunden!');
      return;
    }
    const stored = await getThemeImages(themeKey); // [{name, data}]
    if (!stored || stored.length < numSets) {
      alert('Nicht genügend Bilder im Custom-Thema gespeichert.');
      return;
    }
    // Zufällig genau numSets Bilder aus den gespeicherten dataURLs auswählen
    const picked = pickRandom(stored, numSets);
    imageDataArray = picked.map(item => item.data);
  }

  // Karten erstellen: Jedes Set kommt selection-mal vor
  let cards = [];
  for (let setIdx = 0; setIdx < numSets; setIdx++) {
    const imgSrc = imageDataArray[setIdx];
    for (let n = 0; n < selection; n++) {
      cards.push({
        id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2),
        setIndex: setIdx,
        imageSrc: imgSrc,
        matched: false,
      });
    }
  }
  // Zufällig mischen
  shuffleArray(cards);

  // State setzen
  state.cards = cards;
  state.firstSelection = [];
  state.matchedSets = 0;
  state.totalSets = numSets;
  state.moves = 0;
  state.gameActive = true;
  state.inputLocked = false;
  state.selectionSize = selection;
  state.gameKey = gameKey;
  state.themeKey = themeKey;
  state.elapsed = 0;
  // Merkphase
  state.merkphase = merkphaseToggle.checked;
  if (state.memorizeTimer) { clearTimeout(state.memorizeTimer); state.memorizeTimer = null; }
  if (state.memorizeInterval) { clearInterval(state.memorizeInterval); state.memorizeInterval = null; }
  timerDisplay.textContent = '0:00';
  movesDisplay.textContent = '0';
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.startTime = null;
  // NEU: Peek zurücksetzen
  if (state.peekTimer) { clearTimeout(state.peekTimer); state.peekTimer = null; }
  state.peekActive = false;
  state.peeksLeft = game.peeks ?? 0;

  // UI umschalten
  setupPanel.classList.add('hidden');
  endGamePanel.classList.add('hidden');
  renderBoard(rows, cols, game.maxWidth ?? null);
  // Timer startet beim ersten Aufdecken

  abortGameBtn.classList.remove('hidden');
  uiThemeSelect.classList.add('hidden');

  // NEU: Deal-Animation ausführen, dann ggf. Merkphase starten
  await runDealAnimation();

  // Merkphase – alle Karten kurz aufdecken (nach dem Austeilen)
  if (state.merkphase && state.gameActive) {
    await runMemorizePhase();
  }

  // Peek-Button erst nach Austeilen/Merkphase anzeigen
  updatePeekButton();
}

// ==================== NEU: DEAL-ANIMATION ====================
/**
 * Lässt die Karten nacheinander einfliegen.
 * Die Karten sind während der Animation nicht anklickbar.
 * Danach wird inputLocked freigegeben.
 */
function runDealAnimation() {
  return new Promise((resolve) => {
    if (!state.gameActive) { resolve(); return; }

    state.dealing = true;
    state.inputLocked = true;

    const cardEls = Array.from(gameBoard.children);
    const total = cardEls.length;
    if (total === 0) {
      state.dealing = false;
      state.inputLocked = false;
      resolve();
      return;
    }

    // Board während der Animation sperren
    gameBoard.classList.add('dealing-active');

    // Alle Karten zunächst unsichtbar/verschoben setzen
    cardEls.forEach(el => {
      el.classList.add('dealing');
    });

    // Deal-Hinweis anzeigen
    dealHint.classList.remove('hidden');

    // Timing: abhängig von der Kartenzahl, damit die Animation nicht zu lang wird.
    // Insgesamt ca. 0,6–2,4 Sekunden reine Staffelung + 0,45s pro Karte.
    const stagger = Math.max(18, Math.min(60, 1400 / total)); // ms zwischen Karten
    const perCardDur = 450; // muss zur CSS-Animation passen

    let i = 0;
    function dealNext() {
      if (!state.gameActive) {
        // Spiel wurde abgebrochen – Animation sauber beenden
        cleanupDeal(cardEls, resolve);
        return;
      }
      if (i >= total) {
        // letzte Karte braucht noch ihre Animationszeit
        state.dealTimer = setTimeout(() => {
          cleanupDeal(cardEls, resolve);
        }, perCardDur);
        return;
      }

      const el = cardEls[i];
      el.classList.remove('dealing');
      el.classList.add('deal-in');
      // Deal-Sound (leises Klick/Flip-Geräusch)
      try { sfx.deal && sfx.deal(); } catch (_) {}

      i++;
      state.dealTimer = setTimeout(dealNext, stagger);
    }

    // Kurzer Startverzug, damit das Board sichtbar ist
    state.dealTimer = setTimeout(dealNext, 120);
  });
}

function cleanupDeal(cardEls, resolve) {
  if (state.dealTimer) { clearTimeout(state.dealTimer); state.dealTimer = null; }
  cardEls.forEach(el => {
    el.classList.remove('dealing', 'deal-in');
  });
  gameBoard.classList.remove('dealing-active');
  dealHint.classList.add('hidden');
  state.dealing = false;
  // inputLocked wird hier NICHT freigegeben, falls die Merkphase folgt.
  // Die Merkphase setzt inputLocked ohnehin auf true.
  // Wenn keine Merkphase folgt, muss inputLocked freigegeben werden:
  if (!state.merkphase) {
    state.inputLocked = false;
  }
  resolve();
}

// Merkphase – deckt alle Karten kurz auf (zählt nicht als Zug, Timer läuft noch nicht)
function runMemorizePhase() {
  return new Promise((resolve) => {
    if (!state.merkphase || !state.gameActive) { resolve(); return; }

    // Dauer abhängig von der Kartenzahl (ca. 2,2 s – 6 s)
    const duration = Math.min(6000, 1000 + state.cards.length * 100);
    state.inputLocked = true;

    const cardEls = Array.from(gameBoard.children);
    cardEls.forEach(el => el.classList.add('flipped'));

    let remaining = Math.ceil(duration / 1000);
    merkHintCount.textContent = remaining;
    merkHint.classList.remove('hidden');

    state.memorizeInterval = setInterval(() => {
      remaining--;
      if (remaining > 0) merkHintCount.textContent = remaining;
    }, 1000);

    state.memorizeTimer = setTimeout(() => {
      clearInterval(state.memorizeInterval);
      state.memorizeInterval = null;
      state.memorizeTimer = null;

      merkHint.classList.add('hidden');
      if (!state.gameActive) { resolve(); return; }

      cardEls.forEach(el => el.classList.remove('flipped'));
      state.inputLocked = false;
      resolve();
    }, duration);
  });
}

// ==================== NEU: PEEK ====================
function updatePeekButton() {
  const available = state.gameActive && state.peeksLeft > 0;
  peekWrapper.classList.toggle('hidden', !available);
  peekBadge.textContent = state.peeksLeft;
  peekBtn.disabled = state.peekActive;
}

/**
 * Deckt alle noch nicht gefundenen Karten für 1 Sekunde auf.
 * Kostet 3 Züge und verbraucht einen Peek.
 */
function usePeek() {
  if (!state.gameActive || state.dealing || state.peekActive) return;
  if (state.inputLocked) return;
  if (state.peeksLeft <= 0) return;

  state.peeksLeft--;
  state.peekActive = true;
  state.inputLocked = true;
  updatePeekButton();

  // Peek kostet 3 Züge
  state.moves += 3;
  movesDisplay.textContent = state.moves;

  // Timer starten, falls noch nicht geschehen
  if (state.startTime === null) {
    state.startTime = Date.now();
    startTimer();
  }

  // Laufende Auswahl verwerfen, damit kein inkonsistenter Zustand entsteht
  state.firstSelection = [];

  const cardEls = Array.from(gameBoard.children);
  const revealed = [];
  state.cards.forEach((card, i) => {
    if (card.matched) return;
    const el = cardEls[i];
    if (!el) return;
    el.classList.add('flipped');
    revealed.push(el);
  });

  try { sfx.peek(); } catch (_) {}

  peekHintCount.textContent = '1';
  peekHint.classList.remove('hidden');

  state.peekTimer = setTimeout(() => {
    state.peekTimer = null;
    state.peekActive = false;
    revealed.forEach(el => el.classList.remove('flipped'));
    peekHint.classList.add('hidden');
    if (!state.gameActive) return;
    state.inputLocked = false;
    updatePeekButton();
  }, 1000);
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}
// Wählt zufällig n Elemente aus einem Array (ohne Zurücklegen)
function pickRandom(arr, n) {
  const copy = [...arr];
  shuffleArray(copy);
  return copy.slice(0, n);
}

function renderBoard(rows, cols, maxWidth) {
  gameBoard.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  gameBoard.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  gameBoard.innerHTML = '';
  gameBoard.style.maxWidth = maxWidth;

  state.cards.forEach((card, idx) => {
    const cardEl = document.createElement('div');
    cardEl.className = 'card';
    cardEl.dataset.index = idx;
    cardEl.dataset.setIndex = card.setIndex;

    const back = document.createElement('div');
    back.className = 'card-back';
    back.innerHTML = '<i class="bi bi-question-lg"></i>';

    const front = document.createElement('div');
    front.className = 'card-front';
    const img = document.createElement('img');
    img.src = card.imageSrc;
    img.alt = 'Memory Bild';
    img.loading = 'lazy';
    front.appendChild(img);

    cardEl.appendChild(back);
    cardEl.appendChild(front);
    cardEl.addEventListener('click', () => onCardClick(idx));
    gameBoard.appendChild(cardEl);
  });
}

function onCardClick(index) {
  if (!state.gameActive || state.inputLocked) return;
  if (state.dealing) return; // Sicherheitsnetz
  const card = state.cards[index];
  if (card.matched) return;
  const cardEl = gameBoard.children[index];
  if (cardEl.classList.contains('flipped')) return; // bereits aufgedeckt (sollte nicht passieren)

  // Erster Klick? Timer starten
  if (state.startTime === null) {
    state.startTime = Date.now();
    startTimer();
  }

  // Karte aufdecken
  cardEl.classList.add('flipped');
  try { sfx.flip(); } catch (_) {}
  state.firstSelection.push({ index, setIndex: card.setIndex, el: cardEl });

  if (state.firstSelection.length === state.selectionSize) {
    state.inputLocked = true;
    state.moves++;
    movesDisplay.textContent = state.moves;

    const selection = state.firstSelection;
    const firstSet = selection[0].setIndex;
    const allSame = selection.every(s => s.setIndex === firstSet);

    if (allSame) {
      // Erfolg: alle Karten des Sets bleiben aufgedeckt (matched)
      selection.forEach(s => {
        const c = state.cards[s.index];
        c.matched = true;
        s.el.classList.add('matched');
      });
      state.matchedSets++;
      state.firstSelection = [];
      state.inputLocked = false;
      try { sfx.match(); } catch (_) {}

      // Spielende prüfen
      if (state.matchedSets === state.totalSets) {
        endGame();
      }
    } else {
      // Fehlschlag: nach 1 Sekunde zurückdrehen
      try { sfx.mismatch(); } catch (_) {}
      setTimeout(() => {
        selection.forEach(s => {
          s.el.classList.remove('flipped');
        });
        state.firstSelection = [];
        state.inputLocked = false;
      }, 1000);
    }
  }
}

let audioCtx = null;
function beep(freq, duration = 0.08, type = 'sine', volume = 0.05) {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(volume, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}
const sfx = {
  flip:     () => beep(520, 0.06),
  match:    () => { beep(660, 0.10); setTimeout(() => beep(880, 0.15), 80); },
  mismatch: () => beep(180, 0.18, 'sawtooth', 0.025),
  win:      () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.22), i * 110)),
  // NEU: Deal-Sound – sehr leise, kurzer Tick
  deal:     () => beep(320 + Math.random() * 140, 0.035, 'triangle', 0.018),
  // NEU: Peek-Sound
  peek:     () => { beep(760, 0.09); setTimeout(() => beep(1140, 0.12), 80); },
};
function fireConfetti() {
  const colors = ['#5f9ea0','#00f5d4','#ffbf47','#f87171','#a143ef','#8ce9ff'];
  for (let i = 0; i < 90; i++) {
    const p = document.createElement('div');
    p.style.cssText = `position:fixed;left:50%;top:40%;width:8px;height:8px;background:${colors[i % colors.length]};z-index:9999;pointer-events:none;border-radius:2px;`;
    document.body.appendChild(p);
    const angle = Math.random() * Math.PI * 2;
    const dist = 100 + Math.random() * 450;
    p.animate([
      { transform: 'translate(-50%,-50%) rotate(0deg)', opacity: 1 },
      { transform: `translate(${Math.cos(angle)*dist - 50}%,${Math.sin(angle)*dist + 300}%) rotate(${Math.random()*720}deg)`, opacity: 0 }
    ], { duration: 1400 + Math.random()*1000, easing: 'cubic-bezier(0.15,0.6,0.4,1)' });
    setTimeout(() => p.remove(), 2600);
  }
}

async function endGame() {
  state.gameActive = false;
  stopTimer();
  // NEU: Peek-Button ausblenden
  updatePeekButton();

  // Zeit und Züge
  const elapsed = state.elapsed;
  const moves = state.moves;

  // Default-Name aus letztem Ergebnis
  const results = getResults();
  const defaultName = results.length > 0 ? results[0].name : 'Memory';
  playerNameInput.value = defaultName;

  endGameStats.textContent = `Zeit: ${formatTime(elapsed)} · Züge: ${moves}`;
  endGamePanel.classList.remove('hidden');

  abortGameBtn.classList.add('hidden');
  uiThemeSelect.classList.remove('hidden');

  // Highscore prüfen und ggf. speichern (ohne Namen)
  updateHighscoreIfNeeded(elapsed, moves, state.gameKey, state.themeKey, state.merkphase);

  // Ergebnisse aktualisieren (ohne Speichern-Button)
  updateHighscoreDisplay();

  fireConfetti();
  sfx.win();

}

function updateHighscoreIfNeeded(elapsed, moves, gameKey, themeKey, merkphase) {
  const key = getHighscoreKey(gameKey, themeKey, merkphase);
  const hs = getHighscores();
  const current = hs[key];
  if (!current || elapsed < current.elapsed || (elapsed === current.elapsed && moves < current.moves)) {
    hs[key] = { elapsed, moves };
    saveHighscores(hs);
  }
}

// Ergebnis speichern (Button)
saveScoreBtn.addEventListener('click', () => {
  const name = playerNameInput.value.trim() || 'Memory';
  const elapsed = state.elapsed;
  const moves = state.moves;
  const game = state.gameKey;

const themeNameInput = document.getElementById('themeNameInput');
const themeFilesInput = document.getElementById('themeFilesInput');
const uploadErrors = document.getElementById('uploadErrors');
const saveThemeBtn = document.getElementById('saveThemeBtn');
const closeModalBtn = document.getElementById('closeModalBtn');
const openCreateThemeBtn = document.getElementById('openCreateThemeBtn');
const editThemeBtn = document.getElementById('editThemeBtn');
const deleteThemeBtnInModal = document.getElementById('deleteThemeBtn');
const themeModalTitle = document.getElementById('themeModalTitle');
const themeEditorGrid = document.getElementById('themeEditorGrid');
const themeEditorCount = document.getElementById('themeEditorCount');
const addImagesBtn = document.getElementById('addImagesBtn');
const pasteImagesBtn = document.getElementById('pasteImagesBtn');

// Editor-State
let editorState = {
  mode: 'create',        // 'create' | 'edit'
  editThemeKey: null,    // bei edit: der Key des zu bearbeitenden Themes
  images: [],            // [{ name, data (dataURL), isNew }]
  existingImages: [],    // Originalbilder (nur bei edit), um nicht-benötigte nicht zu löschen
};

const MAX_IMAGES = 72;
const THUMB_MAX_WIDTH = 250;

// ---------- Öffnen: Neues Thema ----------
openCreateThemeBtn.addEventListener('click', () => {
  openEditor('create');
});

// ---------- Öffnen: Bearbeiten ----------
editThemeBtn.addEventListener('click', async () => {
  const themeKey = themeSelect.value;
  const customThemes = getCustomThemes();
  if (!customThemes[themeKey]) {
    alert('Nur Custom-Themes können bearbeitet werden.');
    return;
  }
  openEditor('edit', themeKey);
});

async function openEditor(mode, themeKey = null) {
  uploadErrors.textContent = '';
  editorState.mode = mode;
  editorState.editThemeKey = themeKey;
  editorState.images = [];
  editorState.existingImages = [];

  if (mode === 'create') {
    themeModalTitle.textContent = 'Neues Thema erstellen';
    themeNameInput.value = '';
    deleteThemeBtnInModal.style.display = 'none';
  } else {
    const customThemes = getCustomThemes();
    const meta = customThemes[themeKey];
    if (!meta) { alert('Thema nicht gefunden.'); return; }
    themeModalTitle.textContent = 'Thema bearbeiten';
    themeNameInput.value = meta.label;
    deleteThemeBtnInModal.style.display = 'inline-flex';

    // Vorhandene Bilder laden
    let stored = [];
    try { stored = await getThemeImages(themeKey); } catch (_) {}
    editorState.existingImages = stored.map(item => ({ name: item.name, data: item.data }));
    editorState.images = stored.map(item => ({
      name: item.name,
      data: item.data,
      isNew: false,
    }));
  }

  renderEditorGrid();
  createModal.classList.remove('hidden');
}

// ---------- Schließen ----------
function closeEditor() {
  createModal.classList.add('hidden');
  editorState.images = [];
  editorState.existingImages = [];
  editorState.editThemeKey = null;
}
closeModalBtn.addEventListener('click', closeEditor);

// ---------- Hinzufügen über Button ----------
addImagesBtn.addEventListener('click', () => themeFilesInput.click());

themeFilesInput.addEventListener('change', async () => {
  const files = Array.from(themeFilesInput.files);
  themeFilesInput.value = ''; // zurücksetzen, damit gleiche Datei erneut wählbar
  await addImagesFromFiles(files);
});

// ---------- Hinzufügen über Zwischenablage-Button ----------
pasteImagesBtn.addEventListener('click', async () => {
  try {
    const items = await navigator.clipboard.read();
    const files = [];
    for (const item of items) {
      for (const type of item.types) {
        if (type.startsWith('image/')) {
          const blob = await item.getType(type);
          const ext = type.split('/')[1] || 'png';
          files.push(new File([blob], `clipboard.${ext}`, { type: blob.type }));
        }
      }
    }
    if (files.length === 0) {
      uploadErrors.textContent = 'Keine Bilder in der Zwischenablage gefunden.';
      return;
    }
    await addImagesFromFiles(files);
  } catch (err) {
    uploadErrors.textContent = 'Zwischenablage konnte nicht gelesen werden (Berechtigung?).';
  }
});

// ---------- Globale Strg+V / Cmd+V-Unterstützung ----------
document.addEventListener('paste', async (e) => {
  if (createModal.classList.contains('hidden')) return;
  const items = Array.from(e.clipboardData?.items || []);
  const files = [];
  for (const item of items) {
    if (item.kind === 'file' && item.type.startsWith('image/')) {
      const file = item.getAsFile();
      if (file) files.push(file);
    }
  }
  if (files.length > 0) {
    e.preventDefault();
    await addImagesFromFiles(files);
  }
});

// ---------- Validierung + Umwandlung ----------
const VALID_TYPES = ['image/webp', 'image/png', 'image/jpeg'];

async function addImagesFromFiles(files) {
  uploadErrors.textContent = '';
  if (!files || files.length === 0) return;

  // Kapazitätsprüfung
  if (editorState.images.length + files.length > MAX_IMAGES) {
    uploadErrors.textContent = `Maximal ${MAX_IMAGES} Bilder pro Thema.`;
    return;
  }

  // Format- und Größenvalidierung
  for (const file of files) {
    if (!VALID_TYPES.includes(file.type)) {
      uploadErrors.textContent = `Ungültiges Format: ${file.name}. Nur webp, png, jpg.`;
      return;
    }
    if (file.size > 15 * 1024 * 1024) {
      uploadErrors.textContent = `"${file.name}" ist zu groß (max. 15 MB).`;
      return;
    }
  }

  // Verarbeitung: alle nacheinander (Reihenfolge wichtig für Konsistenz)
  for (const file of files) {
    try {
      const dataURL = await readFileAsDataURL(file);
      const processed = await makeThumbDataURL(dataURL);
      editorState.images.push({
        name: String(editorState.images.length + 1),
        data: processed,
        isNew: true,
      });
    } catch (err) {
      uploadErrors.textContent = `Fehler beim Verarbeiten von ${file.name}: ${err.message}`;
      return;
    }
  }

  renderEditorGrid();
}

// Wandelt ein Bild in ein webp-Thumb mit max. 250px Breite um.
// Ist die Breite <= 250, wird das Original zurückgegeben.
function makeThumbDataURL(dataURL) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      if (img.naturalWidth <= THUMB_MAX_WIDTH) {
        // bereits klein genug -> Originaldaten unverändert
        resolve(dataURL);
        return;
      }
      const scale = THUMB_MAX_WIDTH / img.naturalWidth;
      const w = THUMB_MAX_WIDTH;
      const h = Math.max(1, Math.round(img.naturalHeight * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      try {
        const out = canvas.toDataURL('image/webp', 0.85);
        // Fallback falls Browser kein webp liefert
        if (!out.startsWith('data:image/webp')) {
          resolve(dataURL);
        } else {
          resolve(out);
        }
      } catch (_) {
        resolve(dataURL);
      }
    };
    img.onerror = () => reject(new Error('Bild konnte nicht geladen werden'));
    img.src = dataURL;
  });
}

// ---------- Editor-Vorschau ----------
function renderEditorGrid() {
  themeEditorGrid.innerHTML = '';
  if (editorState.images.length === 0) {
    themeEditorGrid.innerHTML = '<div class="theme-editor-empty">Noch keine Bilder hinzugefügt.</div>';
  } else {
    editorState.images.forEach((img, idx) => {
      const item = document.createElement('div');
      item.className = 'theme-editor-item';
      item.title = 'Klicken zum Löschen';
      const im = document.createElement('img');
      im.src = img.data;
      im.alt = `Bild ${idx + 1}`;
      item.appendChild(im);
      item.addEventListener('click', () => {
        editorState.images.splice(idx, 1);
        renderEditorGrid();
      });
      themeEditorGrid.appendChild(item);
    });
  }
  themeEditorCount.textContent = `${editorState.images.length} / ${MAX_IMAGES} Bilder`;
}

// ---------- Speichern ----------
saveThemeBtn.addEventListener('click', async () => {
  uploadErrors.textContent = '';
  const name = themeNameInput.value.trim();
  if (!name || name.length < 1 || name.length > 20) {
    uploadErrors.textContent = 'Name muss 1–20 Zeichen lang sein.';
    return;
  }

  if (editorState.images.length < 1) {
    uploadErrors.textContent = 'Mindestens 1 Bild erforderlich.';
    return;
  }
  if (editorState.images.length > MAX_IMAGES) {
    uploadErrors.textContent = `Maximal ${MAX_IMAGES} Bilder erlaubt.`;
    return;
  }

  const customThemes = getCustomThemes();

  // Namen-Eindeutigkeit prüfen (außer bei sich selbst im Edit-Modus)
  const isDuplicate = (key, meta) =>
    meta.label === name && !(editorState.mode === 'edit' && key === editorState.editThemeKey);

  if (THEMES[name] || Object.entries(customThemes).some(([k, v]) => isDuplicate(k, v))) {
    uploadErrors.textContent = 'Name bereits vergeben.';
    return;
  }

  // Format bestimmen (alle neuen Bilder sollen webp sein; bestehende ggf. gemischt)
  // Wir nehmen das Format des ersten Bildes, aber da wir webp-thumbs erzeugen,
  // speichern wir webp als Format-Metadatum.
  // Bestehende Bilder (isNew === false) können andere Formate haben – das ist ok,
  // da sie als dataURL gespeichert sind. Für die Anzeige irrelevant.
  const format = 'webp';

  let themeKey = editorState.editThemeKey;
  if (editorState.mode === 'create') {
    themeKey = 'custom_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    while (THEMES[themeKey] || customThemes[themeKey]) {
      themeKey = 'custom_' + Date.now() + '_' + Math.random().toString(36).substring(2, 8);
    }
  }

  // Bilder serialisieren (Reihenfolge beibehalten, Namen neu nummerieren)
  const imageDataArray = editorState.images.map((img, i) => ({
    name: String(i + 1),
    data: img.data,
  }));

  try {
    await storeThemeImages(themeKey, imageDataArray);
  } catch (e) {
    uploadErrors.textContent = 'Fehler beim Speichern der Bilder (IndexedDB).';
    return;
  }

  customThemes[themeKey] = {
    label: name,
    custom: true,
    images: imageDataArray.length,
    format: format,
  };
  saveCustomThemes(customThemes);

  // UI aktualisieren
  populateThemeSelect();
  themeSelect.value = themeKey;
  state.themeKey = themeKey;
  validateThemeAndGame();
  updateHighscoreDisplay();
  renderThemePreview();

  closeEditor();
});

function readFileAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

// ==================== THEMA LÖSCHEN (im Modal) ====================
deleteThemeBtnInModal.addEventListener('click', async () => {
  if (editorState.mode !== 'edit' || !editorState.editThemeKey) return;
  const themeKey = editorState.editThemeKey;
  const customThemes = getCustomThemes();
  if (!customThemes[themeKey]) {
    alert('Thema nicht gefunden.');
    return;
  }
  if (!confirm(`Thema "${customThemes[themeKey].label}" wirklich löschen?`)) return;

  try {
    await deleteThemeImages(themeKey);
  } catch (e) {
    alert('Fehler beim Löschen der Bilder: ' + e.message);
    return;
  }
  delete customThemes[themeKey];
  saveCustomThemes(customThemes);

  if (state.themeKey === themeKey) {
    state.themeKey = Object.keys(THEMES)[0] || '';
  }
  populateThemeSelect();
  updateHighscoreDisplay();
  renderResults();
  renderThemePreview();
  closeEditor();
});

gameSelect.addEventListener('change', () => {
  state.gameKey = gameSelect.value;

});

themeSelect.addEventListener('change', () => {

// ==================== INIT ====================
async function init() {
  try {
    await initDB();
  } catch (e) {
    alert('IndexedDB konnte nicht geöffnet werden. Custom-Themes sind nicht verfügbar.');
  }
  populateGameSelect();
  populateThemeSelect();
  renderResults();
  updateHighscoreDisplay();

  // Default gameKey / themeKey setzen
  state.gameKey = gameSelect.value;
  state.themeKey = themeSelect.value;
  renderThemePreview();

  // Sanity-Check: 8x8-Limit und gleiche Kartenzahl in sm/lg
  Object.entries(GAMES).forEach(([key, g]) => {
    const [sc, sr] = g.grid.sm;
    const [lc, lr] = g.grid.lg;
    if (sc > 8 || sr > 8 || lc > 8 || lr > 8) {
      console.warn(`GAMES.${key}: Grid überschreitet 8×8 (sm=${sc}×${sr}, lg=${lc}×${lr})`);
    }
    if (sc * sr !== lc * lr) {
      console.warn(`GAMES.${key}: Kartenanzahl sm (${sc * sr}) ≠ lg (${lc * lr})`);
    }
    if ((sc * sr) % g.selection !== 0) {
      console.warn(`GAMES.${key}: Kartenanzahl sm nicht durch selection (${g.selection}) teilbar`);
    }
    if ((lc * lr) % g.selection !== 0) {
      console.warn(`GAMES.${key}: Kartenanzahl lg nicht durch selection (${g.selection}) teilbar`);
    }
  });

  // Bei Größenänderung (nur im Setup) Validierung aktualisieren
  window.addEventListener('resize', () => {
    if (!setupPanel.classList.contains('hidden')) {
      validateThemeAndGame();
    }
  });
}

init();

  // ==================== SPIEL ABBRECHEN ====================
function abortGame() {
  if (!state.gameActive) return;

  // NEU: Deal-Animation aufräumen
  if (state.dealTimer) { clearTimeout(state.dealTimer); state.dealTimer = null; }
  state.dealing = false;
  gameBoard.classList.remove('dealing-active');
  dealHint.classList.add('hidden');
  Array.from(gameBoard.children).forEach(el => el.classList.remove('dealing', 'deal-in'));

  if (state.timerInterval) {
    clearInterval(state.timerInterval);
    state.timerInterval = null;
  }
  // Merkphase-Timer aufräumen
  if (state.memorizeTimer) { clearTimeout(state.memorizeTimer); state.memorizeTimer = null; }
  if (state.memorizeInterval) { clearInterval(state.memorizeInterval); state.memorizeInterval = null; }
  merkHint.classList.add('hidden');

  // NEU: Peek aufräumen
  if (state.peekTimer) { clearTimeout(state.peekTimer); state.peekTimer = null; }
  state.peekActive = false;
  state.peeksLeft = 0;
  peekHint.classList.add('hidden');

  state.startTime = null;
  state.elapsed = 0;
  state.gameActive = false;
  state.inputLocked = false;
  state.firstSelection = [];
  state.moves = 0;
  state.matchedSets = 0;

  timerDisplay.textContent = '0:00';
  movesDisplay.textContent = '0';
  gameBoard.innerHTML = '';
  abortGameBtn.classList.add('hidden');
  endGamePanel.classList.add('hidden');
  setupPanel.classList.remove('hidden');

  gameSelect.value = state.gameKey;
  if (themeSelect.querySelector(`option[value="${state.themeKey}"]`)) {
    themeSelect.value = state.themeKey;
  }
  validateThemeAndGame();
  updateHighscoreDisplay();
  updatePeekButton();
}

abortGameBtn.addEventListener('click', abortGame);

// Einfacher Resize-Handler: setzt nur das Grid-Template am #gameBoard neu
window.addEventListener('resize', () => {
  if (!state.gameActive) return;

// ==================== DRAG & DROP ====================
(function initDragAndDrop() {
  const setupDropZone    = document.getElementById('setupDropZone');
  const setupDropTitle   = document.getElementById('setupDropTitle');
  const setupDropHint    = document.getElementById('setupDropHint');
  const modalDropOverlay = document.getElementById('modalDropOverlay');
  const setupPanelEl     = document.getElementById('setupPanel');

  // Zähler, um verschachtelte dragenter/dragleave zu handhaben
  let setupDragCounter = 0;
  let modalDragCounter = 0;

  const isFileDrag = (e) => {
    if (!e.dataTransfer) return false;
    const types = Array.from(e.dataTransfer.types || []);
    return types.includes('Files');
  };

  // ---------- Setup-Panel: Drop-Zone ----------
  setupPanelEl.addEventListener('dragenter', (e) => {
    if (!isFileDrag(e)) return;
    // Kein Setup-Drop, wenn der Editor offen ist
    if (!createModal.classList.contains('hidden')) return;
    e.preventDefault();
    setupDragCounter++;
    updateSetupDropZoneText();
    setupDropZone.classList.add('active');
  });

  setupPanelEl.addEventListener('dragover', (e) => {
    if (!isFileDrag(e)) return;
    if (!createModal.classList.contains('hidden')) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });

  setupPanelEl.addEventListener('dragleave', (e) => {
    if (!isFileDrag(e)) return;
    setupDragCounter = Math.max(0, setupDragCounter - 1);
    if (setupDragCounter === 0) {
      setupDropZone.classList.remove('active');
    }
  });

  setupPanelEl.addEventListener('drop', async (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    setupDragCounter = 0;
    setupDropZone.classList.remove('active');

    const files = Array.from(e.dataTransfer.files || []);
    if (files.length === 0) return;

    const customThemes = getCustomThemes();
    const currentThemeKey = themeSelect.value;

    if (customThemes[currentThemeKey]) {
      // Custom-Thema ausgewählt -> Bearbeiten-Dialog öffnen und Bilder aufnehmen
      await openEditor('edit', currentThemeKey);
      await addImagesFromFiles(files);
    } else {
      // Default-Thema -> Neu-erstellen-Dialog öffnen
      await openEditor('create');
      await addImagesFromFiles(files);
    }
  });

  function updateSetupDropZoneText() {
    const customThemes = getCustomThemes();
    const currentThemeKey = themeSelect.value;
    if (customThemes[currentThemeKey]) {
      setupDropTitle.textContent = 'Bilder dem Thema hinzufügen';
      setupDropHint.textContent = `„${customThemes[currentThemeKey].label}" wird bearbeitet`;
    } else {
      setupDropTitle.textContent = 'Bilder einem neuen Thema hinzufügen';
      setupDropHint.textContent = 'Neues Thema wird erstellt';
    }
  }

  // ---------- Modal: Drop-Overlay ----------
  // Wir hängen die Listener an das Modal-Content-Element,
  // damit sie nur greifen, wenn der Editor offen ist.
  const modalContent = createModal.querySelector('.modal-content');

  modalContent.addEventListener('dragenter', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    modalDragCounter++;
    modalDropOverlay.classList.add('active');
  });

  modalContent.addEventListener('dragover', (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'copy';
  });

  modalContent.addEventListener('dragleave', (e) => {
    if (!isFileDrag(e)) return;
    modalDragCounter = Math.max(0, modalDragCounter - 1);
    if (modalDragCounter === 0) {
      modalDropOverlay.classList.remove('active');
    }
  });

  modalContent.addEventListener('drop', async (e) => {
    if (!isFileDrag(e)) return;
    e.preventDefault();
    modalDragCounter = 0;
    modalDropOverlay.classList.remove('active');

    const files = Array.from(e.dataTransfer.files || []);
    if (files.length === 0) return;

    await addImagesFromFiles(files);
  });

  // Beim Schließen/Speichern/Löschen des Modals Overlay zurücksetzen
  closeModalBtn.addEventListener('click', () => {
    modalDragCounter = 0;
    modalDropOverlay.classList.remove('active');
  });
  deleteThemeBtnInModal.addEventListener('click', () => {
    modalDragCounter = 0;
    modalDropOverlay.classList.remove('active');
  });
  saveThemeBtn.addEventListener('click', () => {
    modalDragCounter = 0;
    modalDropOverlay.classList.remove('active');
  });
})();
